  # ==========================
  # Main APP (Host Mode)
  # ==========================
  app:
    build: .
    command: bash start.sh
    restart: unless-stopped # Aap chahein toh 'on-failure' bhi rakh sakte hain

    # Host Mode: Isse container direct host ke network ko use karega
    network_mode: "host"

    # AGAR VPN USE KARNA HO: Toh upar wale 'network_mode: "host"' ko comment (#) karein
    # aur niche wali line ka '#' hata dein:
    #network_mode: "service:gluetun"

    volumes:
      - /data/downloads:/usr/src/app/downloads

    environment:
      - DOWNLOAD_DIR=/usr/src/app/downloads/

    env_file:
      - .env
